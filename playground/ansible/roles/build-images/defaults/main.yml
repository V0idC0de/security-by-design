---
# Default variables for build-images role
github_repo: https://github.com/V0idC0de/security-by-design.git
repo_dest: "/home/{{ ansible_user }}/security-by-design"

# Optionally set ref to select a branch; when unset, Git uses the repository
# default branch.
# ref: feature-branch-name

# Optionally allow customizing the folders to search for Dockerfiles
docker_parent_dirs:
  - labs
  - demos
force_build: false
